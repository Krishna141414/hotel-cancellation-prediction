[project]
name = "hotel-cancellation-prediction"
version = "0.1.0"
description = "Train, compare, tune and deploy models that predict hotel booking cancellations."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # import sorting
    "B",   # bugbear (likely bugs)
    "UP",  # modern Python syntax
    "D",   # docstrings
    "ANN", # type hints
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Notebook cells are explained with markdown, not docstrings.
"*.ipynb" = ["D", "ANN", "E402", "E501"]  # long f-string print lines in display cells

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
